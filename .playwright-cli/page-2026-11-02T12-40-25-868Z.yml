  - generic [ref=e69]:
    - heading "Share link" [level=2] [ref=e70]
    - paragraph [ref=e71]: "Changes apply immediately, no restart: the default directory decides what / shows, and a sub-path points a prefix like /abc at another directory. Pick a directory with “Browse…”, or type an absolute path or ~/xxx."
    - paragraph [ref=e72]: Paths match by longest prefix, so you can nest them (/abc/logs); sub-paths always win over the default directory. Built-in routes (/admin, /login, /healthz, /whoami, /api) cannot be taken.
    - paragraph [ref=e73]: If a directory disappears the path returns 404 and the binding is kept (handy for removable disks). Passwords are scrypt-hashed; repeated failures are locked and can be cleared from Accounts → Current locks / failures. Share links look like http://host/path?toke=token (token / pwd / key also work); the token expires (3 days by default, adjustable per row), and a successful visit sets a cookie with the same lifetime and redirects to a clean URL. The old style of putting the password in the URL still works.
    - paragraph [ref=e74]:
      - text: Bindings are stored in settings.mounts inside
      - code [ref=e75]: /tmp/readme-demo/users.json
      - text: and survive restarts.
