  - generic [ref=e69]:
    - heading "分享链接" [level=2] [ref=e70]
    - paragraph [ref=e71]: 保存后立即生效，不用重启：默认目录决定 / 下看到什么；子路径把 /abc 这种前缀单独指到另一个目录。目录可以点「浏览…」在弹窗里挑，也可以直接手输（绝对路径或 ~/xxx）。
    - paragraph [ref=e72]: 路径按最长前缀匹配，可以绑多层（/abc/logs），子路径总是赢过默认目录；/admin、/login、/healthz、/whoami、/api 这些内置接口不能占用。
    - paragraph [ref=e73]: 目录暂时不存在时该路径返回 404，绑定不会被删掉（外挂盘没挂上时很实用）。独立口令的密码用 scrypt 加盐哈希保存，连错同样会被锁定，可在「账号管理 → 当前锁定 / 失败记录」里解锁。分享链接形如 http://这台机器/路径?toke=令牌（也认 token / pwd / key），令牌带过期时间（默认 3 天，行内可改），验证通过后种一个同有效期的 Cookie 并跳到不带令牌的干净地址；旧版直接把密码拼在 URL 里的写法仍然兼容。
    - paragraph [ref=e74]:
      - text: 绑定表保存在
      - code [ref=e75]: /tmp/readme-demo/users.json
      - text: 的 settings.mounts 里，重启后依旧有效。